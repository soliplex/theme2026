name: theme_template
description: "Theme Template - AI chat application"
publish_to: 'none'
version: 0.3.1+12

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  soliplex_frontend:
    git:
      url: https://github.com/soliplex/frontend.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/theme_template/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

# All icons derive from one master (app_icon.png), except the Android adaptive
# foreground and the iOS dark home-screen icon. Backgrounds are colors, not files.
flutter_launcher_icons:
  image_path: "assets/branding/theme_template/app_icon.png"
  # Android
  android: true
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/branding/theme_template/adaptive_foreground.png"
  adaptive_icon_background: "#d2d1e0"
  adaptive_icon_monochrome: "assets/branding/theme_template/adaptive_monochrome.png"
  # iOS (light = image_path; dark stays transparent, iOS composites its own backdrop)
  ios: true
  image_path_ios_dark_transparent: "assets/branding/theme_template/app_icon_ios_dark.png"
  remove_alpha_ios: true
  background_color_ios: "#d2d1e0"
  # Web / macOS / Windows all reuse image_path
  web:
    generate: true
    background_color: "#d2d1e0"
    theme_color: "#0A7AFF"
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256

# One splash pair (light + dark) feeds both the legacy and Android 12+ splashes.
flutter_native_splash:
  color: "#d2d1e0"
  image: "assets/branding/theme_template/splash.png"
  color_dark: "#1d1f23"
  image_dark: "assets/branding/theme_template/splash_dark.png"
  android_12:
    color: "#d2d1e0"
    image: "assets/branding/theme_template/splash.png"
    color_dark: "#1d1f23"
    image_dark: "assets/branding/theme_template/splash_dark.png"
  android: true
  ios: true
  web: true
